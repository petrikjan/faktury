services:
  db:
    image: mariadb:12.3.2
    environment:
      MARIADB_DATABASE: faktury
      MARIADB_USER: faktury
      MARIADB_PASSWORD: ${LOCAL_DB_PASSWORD:?Set a local database password}
      MARIADB_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:?Set a local root password}
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      retries: 20
volumes:
  db-data:
